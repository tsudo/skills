name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: python -m pip install skills-ref

      - name: Validate every skill
        run: |
          shopt -s nullglob
          found=0
          for dir in skills/*/; do
            found=1
            echo "::group::${dir}"
            agentskills validate "./${dir%/}"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No skill directories found under skills/."
            exit 1
          fi

      - name: Check for absolute paths
        run: |
          if grep -rnE '/home/|/Users/|C:\\' skills/; then
            echo "Absolute path found. A skill must not reference one machine."
            exit 1
          fi

      - name: Check for outward references
        run: |
          if grep -rn '\.\./' skills/; then
            echo "Reference escapes the skill directory."
            exit 1
          fi

      - name: Check every skill carries its licence and copyright notice
        run: |
          status=0
          for dir in skills/*/; do
            file="${dir}SKILL.md"
            if ! grep -q '^license: MIT$' "$file"; then
              echo "$file does not declare 'license: MIT'."
              status=1
            fi
            if ! grep -q 'Copyright (c) 2026 Keith Crawford' "$file"; then
              echo "$file has no copyright notice. A copied file leaves LICENSE behind."
              status=1
            fi
            if ! grep -q 'SPDX-License-Identifier: MIT' "$file"; then
              echo "$file has no SPDX identifier in its footer."
              status=1
            fi
            if ! grep -q 'blob/main/LICENSE' "$file"; then
              echo "$file footer does not link the repository LICENSE."
              status=1
            fi
          done
          exit "$status"

      - name: Check every bundled file carries an SPDX identifier
        run: |
          status=0
          for file in $(find skills -type f ! -name SKILL.md); do
            if ! grep -q 'SPDX-License-Identifier: MIT' "$file"; then
              echo "$file has no SPDX identifier. Bundled files are redistributed with the skill and leave LICENSE behind."
              status=1
            fi
          done
          exit "$status"
