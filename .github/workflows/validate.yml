name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: python -m pip install skills-ref

      - name: Validate reframe
        run: agentskills validate ./skills/reframe

      - name: Check for absolute paths
        run: |
          if grep -rnE '/home/|/Users/|C:\\' skills/reframe; then
            echo "Absolute path found. A skill must not reference one machine."
            exit 1
          fi

      - name: Check for outward references
        run: |
          if grep -rn '\.\./' skills/reframe; then
            echo "Reference escapes the skill directory."
            exit 1
          fi
